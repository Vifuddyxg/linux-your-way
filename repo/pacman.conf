# Linux Your Way pacman configuration
# Shipped to /usr/share/lyw/pacman.conf; used by the live ISO's pacman and by
# generated build.sh scripts that basestrap/pacstrap Artix/Arch targets.
[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# ----- Artix repositories -----
[system]
Include = /etc/pacman.d/mirrorlist

[world]
Include = /etc/pacman.d/mirrorlist

[galaxy]
Include = /etc/pacman.d/mirrorlist

# ----- LYW local repository (custom packages: the TUI) -----
[lyw]
SigLevel = Optional TrustAll
Server = file:///usr/share/lyw/repo
